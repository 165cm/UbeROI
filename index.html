<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="フードデリバリー副業の本当の時給と投資回収を計算するアプリ" />
    <link rel="manifest" href="/UbeROI/manifest.webmanifest" />
    <link rel="icon" href="/UbeROI/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/UbeROI/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="デリ勘" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>デリ勘</title>
  </head>
  <body>
    <div id="root">
      <!-- アプリが読み込めなかった時だけ見える案内（読み込めれば React がこの中身を置き換える）。古い端末でも動くよう、ここの書き方は古い JavaScript だけにする -->
      <div class="boot-fallback">
        <p><strong>デリ勘を読み込めませんでした</strong></p>
        <p>新しい版に切り替えると直ることがあります。記録は端末に残っています。</p>
        <p><button type="button" id="boot-reload">🔄 新しい版を読み込む</button></p>
        <p>直らない時は、アプリ（Safari のタブ）を完全に閉じてから開き直してください。</p>
      </div>
    </div>
    <style>
      .boot-fallback { padding: 24px 16px; font-family: system-ui, sans-serif; line-height: 1.6; opacity: 0; animation: boot-show 0s linear 8s forwards; }
      .boot-fallback button { min-height: 44px; padding: 0 16px; font-size: 1rem; }
      @keyframes boot-show { to { opacity: 1; } }
    </style>
    <script>
      ;(function () {
        var button = document.getElementById('boot-reload')
        if (!button) return
        button.addEventListener('click', function () {
          var sw = navigator.serviceWorker
          if (!sw) return location.reload()
          sw.addEventListener('controllerchange', function () { location.reload() })
          sw.getRegistration().then(function (reg) {
            if (!reg) return location.reload()
            var skip = function (w) { w.postMessage('SKIP_WAITING') }
            if (reg.waiting) return skip(reg.waiting)
            reg.update().then(function () {
              var w = reg.installing || reg.waiting
              if (!w) return location.reload()
              if (w.state === 'installed') return skip(w)
              w.addEventListener('statechange', function () { if (w.state === 'installed') skip(w) })
            }, function () { location.reload() })
          }, function () { location.reload() })
        })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
